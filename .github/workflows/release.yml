name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK (signed)
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x gradlew
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" > keystore-b64.txt
          base64 -d keystore-b64.txt > keystore-release.jks
          ./gradlew :androidApp:assembleFossRelease --console=plain
          cp androidApp/build/outputs/apk/foss/release/androidApp-foss-release.apk DayDo-${GITHUB_REF_NAME#v}.apk
          echo "apk_name=DayDo-${GITHUB_REF_NAME#v}.apk" >> "$GITHUB_ENV"

      - name: Extract release notes from CHANGELOG
        run: |
          awk '/^## v[0-9]/{if (found) exit; found=1} found' CHANGELOG.md | head -n 60 > RELEASE_NOTES.md
          echo "release notes lines: $(wc -l < RELEASE_NOTES.md)"

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.apk_name }}
          name: DayDo ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
