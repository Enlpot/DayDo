name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify tag matches versionName
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VN=$(grep -m1 'val appVersionName' androidApp/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG" != "$VN" ]; then
            echo "tag v${TAG} does not match versionName ${VN}, aborting" >&2
            exit 1
          fi
          echo "tag/versionName match: v${VN}"

      - name: Validate keystore secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "missing keystore secrets (KEYSTORE_BASE64/KEYSTORE_PASSWORD/KEY_PASSWORD/KEY_ALIAS), aborting" >&2
            exit 1
          fi
          echo "keystore secrets present"

      - name: Build release APK (signed)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x gradlew
          printf '%s' "$KEYSTORE_BASE64" > keystore-b64.txt
          base64 -d keystore-b64.txt > keystore-release.jks
          ./gradlew :androidApp:assembleFossRelease --console=plain
          cp androidApp/build/outputs/apk/foss/release/androidApp-foss-release.apk DayDo-${GITHUB_REF_NAME#v}.apk
          echo "apk_name=DayDo-${GITHUB_REF_NAME#v}.apk" >> "$GITHUB_ENV"

      - name: Extract release notes from CHANGELOG
        run: |
          awk '/^## v[0-9]/{if (found) exit; found=1} found' CHANGELOG.md | head -n 60 > RELEASE_NOTES.md
          echo "release notes lines: $(wc -l < RELEASE_NOTES.md)"

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.apk_name }}
          name: DayDo ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
